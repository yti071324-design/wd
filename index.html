<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>To In One</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --ink:#2B2522;
  --sora:#DCECF6;
  --diary:#EAE4F5;
  --mint:#DFECE4;
  --cream:#F6F3EE;
  --c0:#DCECE3;--c1:#ECE7DC;--c2:#F6EAD0;--c3:#F4DFD4;
  --rust:#B54962;
  --line:rgba(43,37,34,.09);
  --f-body:'Plus Jakarta Sans','Pretendard Variable',Pretendard,sans-serif;
  --f-disp:'Plus Jakarta Sans','Pretendard Variable',Pretendard,sans-serif;
  --f-serif:'Noto Serif KR',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{background:#fff;color:var(--ink);font-family:var(--f-body);font-weight:500;letter-spacing:-0.015em;margin:0}
body.modal-open{overflow:hidden}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}

.disp{font-family:var(--f-disp);font-weight:800;letter-spacing:-0.04em}
.num{font-family:var(--f-disp);font-weight:800;letter-spacing:-0.035em;font-variant-numeric:tabular-nums}
.quote{font-family:var(--f-serif);font-weight:400;line-height:1.58;letter-spacing:-0.025em;word-break:keep-all}

.b3{border:1.5px solid rgba(43,37,34,.18);border-radius:16px}
.bb3{border-bottom:1px solid var(--line)}

#tabs{position:relative;padding:0 18px}
#tabs .tpill{position:absolute;left:0;top:0;border-radius:999px;background:var(--ink);pointer-events:none;z-index:0;transition:transform .38s cubic-bezier(.25,1.15,.4,1),width .38s cubic-bezier(.25,1.15,.4,1)}
.tab{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;padding:8px 15px;margin:7px 0;border-radius:999px;font-weight:600;font-size:13.5px;color:rgba(43,37,34,.62);transition:color .22s ease,transform .1s ease}
.tab:hover{color:var(--ink)}
.tab.on{color:#fff}
.tab:active{transform:scale(.96)}

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wday{position:relative;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;margin-bottom:14px;border-radius:999px;background:#F3F2F0;font-size:14.5px;font-weight:700;letter-spacing:-0.015em;cursor:pointer;transition:background .15s}
.wday:hover{background:#EAE8E4}
.wday input{position:absolute;inset:0;opacity:0;cursor:pointer}
.wday b{font-weight:800}

.vcard{display:block;width:100%;text-align:left;padding:4px 0 4px 16px;border-left:2.5px solid rgba(43,37,34,.22);border-radius:0;transition:border-color .15s,opacity .15s}
.vcard:hover{border-left-color:var(--ink)}
.vcard:active{opacity:.65}
.vref{display:block;margin-top:9px;font-size:12px;font-weight:600;letter-spacing:0;color:rgba(43,37,34,.45)}

.card{background:#fff;border:1.5px solid rgba(43,37,34,.14);border-radius:6px}
.bgcells{gap:10px;padding:0 22px 22px}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:15px 15px 13px;text-align:left;min-width:0;border-radius:14px;background:#F5F4F2;transition:background .15s,transform .1s}
.cell:hover{background:#ECEBE8}
.cell:active{transform:scale(.985)}
.cell.on{background:#ECEBE8;box-shadow:inset 0 0 0 1.5px var(--ink)}
.tile-0,.tile-1,.tile-2,.tile-3{background:#F5F4F2}
.cname{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:rgba(43,37,34,.62)}
.camt{font-size:21px;line-height:1.15;margin-top:2px;color:var(--ink)}
.camt.over{color:#D93025}
.cmeta{font-size:12px;font-weight:500;color:rgba(43,37,34,.5)}
.cmeta.over{color:#D93025;font-weight:600}
.cbar{display:flex;width:100%;height:5px;border-radius:999px;background:rgba(43,37,34,.1);margin-top:9px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--ink)}
.cbar i.est{background:rgba(43,37,34,.35)}
.cbar.cover i{background:#D93025}

.track{height:16px;padding:2px;border:1.5px solid rgba(43,37,34,.16);border-radius:999px;overflow:hidden;background:#F5F4F2}
.track.mix{height:12px;padding:0;border:0;background:#EDEDEB}
.mixbar{display:flex;width:100%;height:100%;border-radius:999px;overflow:hidden}
.mixbar i{display:block;min-width:6px;height:100%}
.mixbar i.est{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.68) 0 4px,transparent 4px 8px)}

.money{display:flex;align-items:baseline;gap:2px;font-family:var(--f-disp);font-weight:800;font-size:38px;line-height:1.05;letter-spacing:-0.04em}
.money span{font-size:28px;opacity:.55}
.money input{font:inherit;letter-spacing:inherit;color:inherit;background:transparent;border:0;outline:0;padding:0;width:100%;min-width:0}

.btn{border:0;border-radius:999px;font-weight:600;transition:transform .1s ease,opacity .15s}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff}

.pill{border:1px solid rgba(43,37,34,.15);border-radius:999px;padding:0 13px;height:33px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;background:#fff;transition:background .15s,color .15s,border-color .15s}
.pill:hover{border-color:rgba(43,37,34,.35)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stp::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--d)}

.und{text-decoration:underline;text-decoration-color:rgba(43,37,34,.32);text-decoration-thickness:1.5px;text-underline-offset:4px;font-weight:600;transition:text-decoration-color .15s}
.und:hover{text-decoration-color:var(--ink)}

.lcard{overflow:hidden;border-radius:6px}
.lrow{display:flex;align-items:center;gap:13px;padding:15px 18px;border-top:1px solid var(--line);background:#fff;cursor:pointer;transition:background .12s}
.lrow:first-child{border-top:0}
.lrow:hover{background:#FAF9F7}
.lrow:active{background:#F5F3EE}
.lrow.done{opacity:.55}
.lsw{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;overflow:hidden;font-size:16px}
.lsw img{width:100%;height:100%;object-fit:cover;display:block}
.c-sora{background:var(--sora)}.c-oat{background:var(--c1)}.c-sand{background:var(--c2)}.c-blush{background:var(--c3)}
.lnm{font-size:15.5px;font-weight:600;line-height:1.35}
.done .lnm{text-decoration:line-through;text-decoration-thickness:1.5px}
.lmt{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;font-weight:500;color:rgba(43,37,34,.55);min-width:0}
.lmt .dot{width:6px;height:6px;border-radius:50%;background:var(--d);flex:none}
.lmt .st{font-weight:600;color:rgba(43,37,34,.75);flex:none}
.lmt .due{font-weight:700;color:var(--rust);flex:none}
.lmt .pri{font-weight:700;color:var(--ink);flex:none}
.lmt .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lamt{flex:none;text-align:right;font-family:var(--f-disp);font-weight:800;font-size:15.5px;letter-spacing:-0.03em;line-height:1.2}
.lamt small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:500;color:rgba(43,37,34,.45);margin-top:2px}
.lrow.open{background:#FAF9F7}
.lcmp{background:#F8F7F4;border-top:1px solid var(--line);padding:6px 18px 14px}
.crow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px}
.crow:first-child{border-top:0}
.crow.pick{font-weight:700}

/* 모달 레이아웃: 모바일에서 가로 초과 방지 */
.dlg{
  width:100%;
  max-width:440px;
  max-height:88dvh;
  background:#fff;
  border-radius:26px;
  box-shadow:0 24px 60px rgba(0,0,0,.22);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
#m-body{
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.pe-h{background:var(--mint);padding:16px 20px 18px}
.pe-h--diary{background:var(--diary)}
.pe-h--neutral{background:#F5F4F2}
.pe-top{display:flex;justify-content:space-between;align-items:center}
.pe-cat{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(255,255,255,.72);font-size:12.5px;font-weight:600;color:var(--ink);border:0}
.pe-x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.72);font-size:14px;font-weight:700;color:var(--ink);display:grid;place-items:center;border:0;flex:none}
.pe-name{width:100%;background:transparent;border:0;border-bottom:1.5px solid rgba(43,37,34,.22);padding:6px 0 8px;margin-top:8px;outline:0;font:700 22px/1.25 var(--f-body);letter-spacing:-0.025em;color:var(--ink)}
.pe-name:focus{border-bottom-color:var(--ink)}
.pe-name::placeholder{color:rgba(43,37,34,.35);font-weight:600}
.pe-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.pe-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.pe-l{font-size:12px;font-weight:600;color:rgba(43,37,34,.55)}
.pe-i,.pe-t{width:100%;max-width:100%;min-width:0;min-height:42px;padding:0 13px;border-radius:12px;border:1px solid rgba(43,37,34,.14);background:#fff;font-size:14.5px;font-weight:500;color:var(--ink);outline:0}
.pe-i:focus,.pe-t:focus{border-color:var(--ink)}
.pe-t{min-height:76px;padding:10px 13px;resize:vertical;line-height:1.5}
.pe-s{display:flex;flex-wrap:wrap;gap:6px}
.pe-s button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:#F3F2F0;color:rgba(43,37,34,.7);border:0}
.pe-s button.on{background:var(--ink);color:#fff}
.pe-rc{background:#F5F4F2;border-radius:16px;padding:5px}
.pe-rr{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 10px}
.pe-rr+.pe-rr{border-top:1px solid rgba(43,37,34,.07)}
.pe-rl{width:46px;font-size:14px;font-weight:600;color:var(--ink);flex:none}
.pe-amt{flex:1;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid rgba(43,37,34,.1);border-radius:11px;height:40px;padding:0 11px;min-width:0}
.pe-amt:focus-within{border-color:var(--ink)}
.pe-amt input{flex:1;min-width:0;border:0;outline:0;background:transparent;text-align:right;font:700 17px/1 var(--f-disp);letter-spacing:-0.02em;color:var(--ink)}
.pe-amt span{font-size:13px;font-weight:600;color:rgba(43,37,34,.45)}
.pe-rm{width:28px;height:28px;border-radius:50%;color:rgba(43,37,34,.4);font-size:13px;display:grid;place-items:center;flex:none;border:0;background:transparent}
.pe-rm:hover{background:rgba(43,37,34,.08);color:var(--ink)}
.pe-ft{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.pe-del{padding:8px 10px;font-size:13px;font-weight:600;color:#D93025;border:0;background:transparent}
.pe-save{padding:11px 22px;border-radius:999px;background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;border:0}
.pe-can{padding:11px 16px;border-radius:999px;background:#F3F2F0;color:var(--ink);font-size:14.5px;font-weight:600;border:0}

/* 기념일 설정 모바일 최적화 (깨짐 해결 핵심) */
.anniv-hero{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.anniv-form{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.anniv-form-row{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  min-width:0;
}
.anniv-form-row input[type="date"]{
  flex:1 1 auto;
  min-width:0;
  width:0;
}
.anniv-add-btn{
  flex:none;
  height:42px;
  padding:0 16px;
  border-radius:12px;
  background:var(--ink);
  color:#fff;
  font-size:13.5px;
  font-weight:700;
  border:0;
  white-space:nowrap;
}
.anniv-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-width:0;
}
.anniv-item-info{
  flex:1;
  min-width:0;
}
.anniv-item-title{
  font-size:14.5px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.anniv-item-right{
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
}

.sst{color:#3E8E6E;display:inline-flex;align-items:center;gap:6px}
.sst::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(62,142,110,.2)}
.sst.er{color:#D93025}
.sst.sy{color:rgba(43,37,34,.55)}

.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 18px}
@media (min-width:1000px){
  .wrap{padding:0 28px}
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:end;padding-top:44px;padding-bottom:36px}
  .hero .h1{font-size:88px}
  .pcols{display:grid;grid-template-columns:360px minmax(0,1fr);gap:32px;align-items:start;max-width:1080px;margin:0 auto;padding:0 28px}
  .pcols .wrap{padding:0}
  .pside{position:sticky;top:118px}
  .pside .bgcells{grid-template-columns:1fr}
  .pside .cell{display:grid;grid-template-columns:1fr auto;align-items:center;padding:13px 15px}
  .pside .camt{font-size:16px;margin-top:0}
  .pside .cmeta{display:none}
  .pside .cbar{grid-column:1/-1;margin-top:8px}
}
</style>
</head>
<body>

<main id="app" data-page="plans" class="min-h-screen pb-16">
  <header class="sticky top-0 z-40 bb3" style="background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)">
    <div class="wrap py-3 flex items-center justify-between">
      <button id="logo" class="flex items-center gap-2 text-left">
        <svg class="logo-m" width="22" height="22" viewBox="0 0 64 64" style="vertical-align:-4px"><rect x="3" y="3" width="58" height="58" rx="16" fill="#F9DCD3"/><path d="M13.5 29.5 32 14l18.5 15.5V48a3.5 3.5 0 0 1-3.5 3.5H17a3.5 3.5 0 0 1-3.5-3.5z" fill="#fff" stroke="#2B2522" stroke-width="4.5" stroke-linejoin="round"/><path d="M32 44.5s-8.2-4.7-9.7-9.4a5.1 5.1 0 0 1 9.7-3.2 5.1 5.1 0 0 1 9.7 3.2c-1.5 4.7-9.7 9.4-9.7 9.4z" fill="#B54962"/></svg>
        <span class="disp text-[22px]">TO IN ONE</span>
      </button>
    </div>
  </header>

  <nav class="sticky top-[54px] z-30 bb3" style="background:rgba(255,255,255,.9);backdrop-filter:blur(14px)">
    <div class="wrap" style="padding:0"><ul id="tabs" class="flex overflow-x-auto no-scrollbar"></ul></div>
  </nav>

  <section id="hero-sec" class="wrap pt-7 pb-5 hero">
    <div>
      <h1 class="disp h1 text-[52px] leading-[.92] mb-4">TAEIN&amp;<br>GAHYUN.</h1>
      <label class="wday">
        <input type="date" id="wdate" value="2027-05-15">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="wdate-txt">2027.05.15 (토)</span>
        <span style="opacity:.35">·</span>
        <b id="dday" class="num">D-174</b>
      </label>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-[13px] font-semibold">
        <span class="sst">공유 연결됨</span>
        <button onclick="openAnnivModal()" class="und">기념일 설정</button>
        <button onclick="toast('공유 · 백업 설정창이 열립니다.')" class="und">공유 · 백업</button>
      </div>
    </div>
    <button type="button" onclick="toast('구절 편집창이 열립니다.')" class="vcard mt-5 lg:mt-0">
      <span class="quote text-[21px] block">“무엇보다도 뜨겁게 서로 사랑할지니 사랑은 허다한 죄를 덮느니라”</span>
      <span class="vref">베드로전서 4:8</span>
    </button>
  </section>

  <!-- 계획 뷰 -->
  <div id="view-plans" class="pcols">
    <aside class="pside mb-8">
      <section class="wrap">
        <div class="card">
          <div class="p-6 pb-5">
            <div class="text-[12.5px] font-semibold mb-1" style="color:rgba(43,37,34,.55)">총 예산</div>
            <label class="money"><span>₩</span><input id="total" value="276,400,000" inputmode="numeric"></label>
            <div class="mt-5">
              <div class="track mix mb-2.5"><div id="bar" class="mixbar"></div></div>
              <div id="usage-desc" class="space-y-1 text-[14px]"></div>
              <div class="flex justify-between items-baseline pt-2 mt-2 border-t" style="border-color:var(--line)">
                <span class="text-[14px]" style="color:rgba(43,37,34,.55)">남음</span>
                <b id="est-desc" class="num text-[17px]"></b>
              </div>
            </div>
          </div>
          <div id="grid" class="bgcells grid grid-cols-2"></div>
          <div class="px-6 pb-5 flex justify-end text-[13px]">
            <button onclick="toast('분류별 예산 수정창이 열립니다.')" class="und">예산 수정</button>
          </div>
        </div>
      </section>
    </aside>

    <section class="wrap pt-1">
      <div class="flex justify-between items-baseline mb-4">
        <h2 class="disp text-[28px]"><span id="ptitle">전체 계획</span></h2>
        <button onclick="toast('새 계획 추가창이 열립니다.')" class="btn btn-primary flex items-center gap-1.5 px-4 h-10 text-[14px]">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> 새 계획
        </button>
      </div>
      <div id="sumline" class="text-[13px] font-semibold mb-4" style="color:rgba(43,37,34,.55)"></div>
      <div id="list" class="space-y-5"></div>
    </section>
  </div>

  <!-- 일기장 뷰 (기념일 설정 버튼 포함) -->
  <section id="view-story" class="wrap pt-5 hidden">
    <div class="flex justify-between items-baseline mb-4">
      <h2 class="disp text-[28px]">일기장</h2>
      <div class="flex items-center gap-2">
        <button onclick="openAnnivModal()" class="pill h-10 px-4">기념일 설정</button>
        <button onclick="toast('새 일기 작성창이 열립니다.')" class="btn btn-primary flex items-center gap-1.5 px-4 h-10 text-[14px]">새 일기</button>
      </div>
    </div>

    <div class="card p-5 mb-5">
      <div class="anniv-hero">
        <div>
          <span class="text-[12px] font-semibold" style="color:rgba(43,37,34,.5)">함께한 날</span>
          <div class="num text-[34px] leading-tight mt-0.5"><span id="days-together">842</span>일</div>
          <div class="text-[12px]" style="color:rgba(43,37,34,.5)">2024.08.04부터</div>
        </div>
        <button onclick="openAnnivModal()" class="und text-[13px] shrink-0">기념일 설정</button>
      </div>
      <div id="anniv-preview" class="mt-4 pt-3 border-t space-y-2" style="border-color:var(--line)"></div>
    </div>
  </section>
</main>

<!-- 모바일 반응형 보완된 모달 -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4" style="backdrop-filter:blur(4px)">
  <div class="dlg" role="dialog" aria-modal="true">
    <div id="m-body"></div>
    <div id="m-foot" class="pe-ft"></div>
  </div>
</div>

<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-6 z-50 px-4 py-2.5 rounded-full text-[13px] font-semibold shadow-lg" style="background:var(--ink);color:#fff"></div>

<script>
const CATS = ['소라', '결혼식준비', '혼수', '신혼여행'];
const STC = { '구상 중': '#A89F99', '비교 중': '#D99B26', '예약/계약': '#378B6B', '완료': '#2B2522' };
const CHD = { '소라': 'c-sora', '결혼식준비': 'c-oat', '혼수': 'c-sand', '신혼여행': 'c-blush' };
const SC = { '소라': '#9BC6E2', '결혼식준비': '#D5CEBE', '혼수': '#E8D19B', '신혼여행': '#E6BFB0' };
const lab = c => c === '결혼식준비' ? '결혼식 준비' : c;
const won = n => '₩' + Math.round(n || 0).toLocaleString('ko-KR');

const SV = d => `<svg class="ic" viewBox="0 0 24 24">${d}</svg>`;
const GL = {
  '소라': SV('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>'),
  '결혼식준비': SV('<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z" fill="currentColor"/>'),
  '혼수': SV('<path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/><path d="M2 16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z"/><path d="M4 18v2M20 18v2"/>'),
  '신혼여행': SV('<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>')
};

const state = {
  page: 'plans',
  cat: 'all',
  total: 276400000,
  togetherSince: '2024-08-04',
  weddingDate: '2027-05-15',
  anniversaries: [
    { id: 'a1', title: '가현 생일', date: '2027-01-09', annual: true },
    { id: 'a2', title: '태인 생일', date: '2027-06-21', annual: true },
    { id: 'a3', title: '상견례', date: '2026-12-19', annual: false }
  ],
  budgets: { '소라': 250000000, '결혼식준비': 14800000, '혼수': 7400000, '신혼여행': 4200000 },
  plans: [
    { id: 1, cat: '결혼식준비', status: '비교 중', name: '스드메 패키지 비교', fix: 4500000, est: 0, due: '12/10 D-18', memo: 'nu.noma 외 2곳 견적 비교 중' },
    { id: 2, cat: '소라', status: '예약/계약', name: '신혼집 전세 보증금', fix: 245000000, est: 0, due: '03/20 D-118', pri: '긴급', memo: '중도금 및 잔금 일정' },
    { id: 3, cat: '혼수', status: '완료', name: '전자레인지', fix: 164000, est: 0, due: '', memo: 'MW23FD 구매 완료' },
    { id: 4, cat: '신혼여행', status: '예약/계약', name: '유럽 왕복 항공권', fix: 3400000, est: 0, due: '', memo: '발권 완료' }
  ]
};

function calcDday(dateStr) {
  if (!dateStr) return 'D-?';
  const [y, m, d] = dateStr.split('-').map(Number);
  const target = new Date(y, m - 1, d);
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const diff = Math.round((target - now) / 86400000);
  if (diff === 0) return 'D-DAY';
  return diff > 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
}

function renderTabs() {
  const ul = document.getElementById('tabs');
  const GRID = '<path d="M4 4h6.5v6.5H4zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4zM13.5 13.5H20V20h-6.5z"/>';
  const HE = '<path d="M12 20s-7-4.4-8.5-9A4.8 4.8 0 0 1 12 8a4.8 4.8 0 0 1 8.5 3c-1.5 4.6-8.5 9-8.5 9z"/>';
  const items = ['all', ...CATS].map(c => `
    <li><button data-cat="${c}" class="tab ${state.page === 'plans' && state.cat === c ? 'on' : ''}">
      ${c === 'all' ? SV(GRID) + ' 전체 계획' : GL[c] + ' ' + lab(c)}
    </button></li>
  `).join('') + `
    <li><button data-page="story" class="tab ${state.page === 'story' ? 'on' : ''}">
      ${SV(HE)} 일기장
    </button></li>
  `;
  ul.innerHTML = `<li class="tpill" id="tpill"></li>` + items;
  requestAnimationFrame(movePill);
}

function movePill() {
  const ul = document.getElementById('tabs');
  const pill = document.getElementById('tpill');
  const active = ul.querySelector('.tab.on');
  if (!active || !pill) return;
  pill.style.width = active.offsetWidth + 'px';
  pill.style.height = active.offsetHeight + 'px';
  pill.style.transform = `translate3d(${active.offsetLeft}px, ${active.offsetTop}px, 0)`;
}

function renderBudget() {
  const total = state.total;
  let used = 0, planned = 0;
  state.plans.forEach(p => { used += p.fix; planned += (p.fix || p.est); });
  const pct = total ? ((planned / total) * 100).toFixed(1) : 0;
  document.getElementById('usage-desc').innerHTML = `
    <div class="flex justify-between items-baseline"><span style="color:rgba(43,37,34,.55)">확정 지출</span><b class="num text-[15px]">${won(used)}</b></div>
    <div class="flex justify-between items-baseline"><span style="color:rgba(43,37,34,.55)">예상 포함 (${pct}%)</span><b class="num text-[15px]">${won(planned)}</b></div>
  `;
  document.getElementById('est-desc').textContent = won(total - planned);

  const segs = CATS.map(c => {
    const val = state.plans.filter(p => p.cat === c).reduce((a, b) => a + (b.fix || b.est), 0);
    return val > 0 ? `<i style="flex:${val};background:${SC[c]}"></i>` : '';
  }).join('');
  const rest = Math.max(0, total - planned);
  document.getElementById('bar').innerHTML = segs + (rest ? `<i style="flex:${rest};background:transparent"></i>` : '');

  document.getElementById('grid').innerHTML = CATS.map((c, i) => {
    const t = state.plans.filter(p => p.cat === c).reduce((a, b) => a + (b.fix || b.est), 0);
    const b = state.budgets[c];
    const ratio = b ? Math.min(100, (t / b) * 100) : 0;
    return `
      <button data-cat="${c}" class="cell tile-${i} ${state.cat === c ? 'on' : ''}">
        <span class="cname">${GL[c]} ${lab(c)}</span>
        <span class="num camt">${won(t)}</span>
        <span class="cmeta">${Math.round(ratio)}% · 예산 ${won(b)}</span>
        <span class="cbar"><i style="width:${ratio}%"></i></span>
      </button>
    `;
  }).join('');
}

function renderPlans() {
  document.getElementById('ptitle').textContent = state.cat === 'all' ? '전체 계획' : lab(state.cat);
  const filtered = state.plans.filter(p => state.cat === 'all' || p.cat === state.cat);
  const sum = filtered.reduce((a, b) => a + (b.fix || b.est), 0);
  document.getElementById('sumline').textContent = `계획 ${filtered.length}건 · 합계 ${won(sum)}`;
  document.getElementById('list').innerHTML = `
    <div class="card lcard">
      ${filtered.map(p => `
        <article class="lrow ${p.status === '완료' ? 'done' : ''}">
          <span class="lsw ${CHD[p.cat]}">${GL[p.cat]}</span>
          <div class="flex-1 min-w-0">
            <div class="lnm truncate">${p.name}</div>
            <div class="lmt">
              <span class="dot" style="--d:${STC[p.status]}"></span>
              <span class="st">${p.status}</span>
              ${p.due ? `<span class="due">${p.due}</span>` : ''}
              <span class="nt">${p.memo}</span>
            </div>
          </div>
          <div class="lamt">${won(p.fix || p.est)}<small>${p.fix ? '확정' : '예상'}</small></div>
        </article>
      `).join('')}
    </div>
  `;
}

function renderAnnivPreview() {
  const box = document.getElementById('anniv-preview');
  if (!box) return;
  box.innerHTML = state.anniversaries.map(a => `
    <div class="flex items-center justify-between text-[13.5px] gap-2">
      <span class="font-semibold truncate">${a.title}</span>
      <span class="num text-[13px] shrink-0" style="color:rgba(43,37,34,.55)">${calcDday(a.date)}</span>
    </div>
  `).join('');
}

/* 기념일 설정 모달 (모바일 폭 초과 및 줄바꿈 깨짐 수정) */
function openAnnivModal() {
  const renderAnnivBody = () => {
    document.getElementById('m-body').innerHTML = `
      <div class="pe-h pe-h--diary">
        <div class="pe-top">
          <span class="pe-cat">기념일 설정</span>
          <button type="button" onclick="closeModal()" class="pe-x">✕</button>
        </div>
        <div class="mt-2 font-bold text-[19px]">우리의 날짜 관리</div>
      </div>

      <div class="pe-b">
        <div class="pe-f">
          <label class="pe-l">함께 시작한 날</label>
          <input type="date" id="an-since" class="pe-i" value="${state.togetherSince}">
        </div>

        <div class="pe-f">
          <label class="pe-l">결혼식 예정일</label>
          <input type="date" id="an-wed" class="pe-i" value="${state.weddingDate}">
        </div>

        <div class="pe-f pt-2 border-t" style="border-color:var(--line)">
          <label class="pe-l">새 기념일 추가</label>
          <div class="anniv-form">
            <input type="text" id="an-title" class="pe-i" placeholder="기념일 이름 (예: 생일, 상견례)">
            <div class="anniv-form-row">
              <input type="date" id="an-date" class="pe-i" value="2027-01-01">
              <label class="inline-flex items-center gap-1.5 text-[12.5px] font-semibold shrink-0 cursor-pointer">
                <input type="checkbox" id="an-annual" checked class="accent-[#2B2522]"> 매년
              </label>
              <button type="button" id="an-add" class="anniv-add-btn">추가</button>
            </div>
          </div>
        </div>

        <div class="pe-f">
          <label class="pe-l">등록된 기념일 (${state.anniversaries.length})</label>
          <div class="pe-rc">
            ${state.anniversaries.length ? state.anniversaries.map((a, idx) => `
              <div class="pe-rr anniv-item">
                <div class="anniv-item-info">
                  <div class="anniv-item-title">${a.title}</div>
                  <div class="text-[12px]" style="color:rgba(43,37,34,.5)">${a.date} ${a.annual ? '· 매년 반복' : ''}</div>
                </div>
                <div class="anniv-item-right">
                  <span class="num text-[13px] px-2 py-0.5 rounded-full bg-white">${calcDday(a.date)}</span>
                  <button type="button" data-del-an="${idx}" class="pe-rm" aria-label="삭제">✕</button>
                </div>
              </div>
            `).join('') : `<div class="p-3 text-center text-[13px]" style="color:rgba(43,37,34,.45)">등록된 기념일이 없습니다.</div>`}
          </div>
        </div>
      </div>
    `;

    document.getElementById('an-add').onclick = () => {
      const title = document.getElementById('an-title').value.trim();
      const date = document.getElementById('an-date').value;
      const annual = document.getElementById('an-annual').checked;
      if (!title || !date) { toast('이름과 날짜를 입력해 주세요.'); return; }
      state.anniversaries.push({ id: 'a' + Date.now(), title, date, annual });
      renderAnnivBody();
      renderAnnivPreview();
    };

    document.querySelectorAll('[data-del-an]').forEach(btn => {
      btn.onclick = () => {
        state.anniversaries.splice(Number(btn.dataset.delAn), 1);
        renderAnnivBody();
        renderAnnivPreview();
      };
    });
  };

  renderAnnivBody();
  document.getElementById('m-foot').innerHTML = `
    <button type="button" onclick="closeModal()" class="pe-can">닫기</button>
    <button type="button" id="an-save" class="pe-save">저장</button>
  `;
  document.getElementById('an-save').onclick = () => {
    state.togetherSince = document.getElementById('an-since').value || state.togetherSince;
    state.weddingDate = document.getElementById('an-wed').value || state.weddingDate;
    document.getElementById('dday').textContent = calcDday(state.weddingDate);
    renderAnnivPreview();
    closeModal();
    toast('기념일 설정이 저장되었습니다.');
  };

  const m = document.getElementById('modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  document.body.classList.add('modal-open');
}

function closeModal() {
  const m = document.getElementById('modal');
  m.classList.add('hidden');
  m.classList.remove('flex');
  document.body.classList.remove('modal-open');
}

function render() {
  const isPlans = state.page === 'plans';
  document.getElementById('hero-sec').classList.toggle('hidden', !isPlans || state.cat !== 'all');
  document.getElementById('view-plans').classList.toggle('hidden', !isPlans);
  document.getElementById('view-story').classList.toggle('hidden', isPlans);
  renderTabs();
  if (isPlans) { renderBudget(); renderPlans(); }
  else { renderAnnivPreview(); }
}

document.addEventListener('click', e => {
  const catBtn = e.target.closest('[data-cat]');
  if (catBtn) { state.page = 'plans'; state.cat = catBtn.dataset.cat; render(); return; }
  const pgBtn = e.target.closest('[data-page]');
  if (pgBtn) { state.page = pgBtn.dataset.page; render(); }
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2000);
}

window.addEventListener('resize', movePill);
render();
</script>
</body>
</html>
